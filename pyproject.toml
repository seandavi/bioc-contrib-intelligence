[project]
name = "bcintel"
version = "0.1.0"
description = "Ingest & query the Bioconductor submission-tracker corpus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "httpx>=0.27", "tenacity>=8.2"]

[project.scripts]
bcintel = "bcintel.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pandas>=2.3.3",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
