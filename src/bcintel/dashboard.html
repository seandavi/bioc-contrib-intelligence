<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioc Review Queue</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1d1d1b; --muted: #6b6b66; --line: #e4e3df; --card: #ffffff;
    --accent: #1a5fb4; --ok: #2e7d32; --warn: #b26a00; --err: #c62828; --hot: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --fg: #e8e7e3; --muted: #9a9993; --line: #2c2c2a; --card: #1e1e1c;
      --accent: #78a9f0; --ok: #7cc47f; --warn: #e0a94a; --err: #ef7a72; --hot: #3a2321;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
           border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header h1 a { color: inherit; text-decoration: none; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: var(--card); }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; white-space: nowrap; }
  td.stage { white-space: nowrap; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.hot td.num.wait { color: var(--err); font-weight: 600; }
  .snip { color: var(--muted); max-width: 420px; overflow: hidden; text-overflow: ellipsis;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .b { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 9px;
       border: 1px solid currentColor; margin: 0 2px 2px 0; white-space: nowrap; }
  .b.ok { color: var(--ok); } .b.warn { color: var(--warn); } .b.err { color: var(--err); }
  .b.turn { color: var(--err); } .b.sub { color: var(--muted); }
  ol.tl { list-style: none; padding: 0; margin: 0; }
  ol.tl li { border-left: 2px solid var(--line); padding: 4px 0 10px 12px; }
  ol.tl li.submitter { border-color: var(--warn); }
  ol.tl li.reviewer { border-color: var(--accent); }
  ol.tl li.ev { padding-bottom: 4px; font-size: 12px; color: var(--muted); }
  ol.tl li.bot details { color: var(--muted); }
  .md { margin-top: 4px; overflow-wrap: anywhere; }
  .md pre { overflow-x: auto; background: var(--line); padding: 8px; border-radius: 4px; }
  .md code { font-size: 12px; } .md img { max-width: 100%; }
  .md table { width: auto; } .md p { margin: 6px 0; }
  .note { font-size: 12px; color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <h1><a href="#/">Bioc review queue</a></h1>
    <span class="muted" id="meta">loading…</span>
  </header>
  <div id="view"></div>
  <p class="note">Read-only. "Reviewer's move" means the reviewer hasn't commented on the issue
    since assignment, or the submitter commented or pushed after the reviewer's last comment.
    Activity outside the issue thread (e.g. reviews on the package repo) is not visible.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
let D;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const days = (t) => (t ? Math.floor((Date.now() - new Date(t)) / 864e5) : null);
const gh = (n) => `https://github.com/${D.repo}/issues/${n}`;
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y);
  const m = s.length >> 1; return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); };

function badges(build) {
  return (build || []).map((b) => {
    const k = /Error/.test(b) ? "err" : /Warning|Unknown/.test(b) ? "warn" : "ok";
    return `<span class="b ${k}">${esc(b.replace("Build ", ""))}</span>`;
  }).join("");
}
const issueLink = (n) => `<a href="#/i/${n}">#${n}</a>`;
const userLink = (u) => `<a href="#/r/${encodeURIComponent(u)}">${esc(u)}</a>`;

function queueTable(rows, showReviewer) {
  if (!rows.length) return `<p class="muted">Nothing here.</p>`;
  return `<div class="scroll"><table><thead><tr>
    <th>#</th><th>Package</th>${showReviewer ? "<th>Reviewer</th>" : ""}<th>Submitter</th>
    <th class="num">Waiting</th><th>Since reviewer</th><th>Build</th><th>Stage</th><th>Last comment</th>
    </tr></thead><tbody>${rows.map((r) => {
      const w = days(r.waiting_since);
      const since = [r.comments_since && `${r.comments_since} comment${r.comments_since > 1 ? "s" : ""}`,
                     r.pushes_since && `${r.pushes_since} push${r.pushes_since > 1 ? "es" : ""}`]
                     .filter(Boolean).join(", ") || "—";
      return `<tr class="${r.reviewer_turn && w > 14 ? "hot" : ""}">
        <td>${issueLink(r.issue_number)}</td><td>${esc(r.title)}</td>
        ${showReviewer ? `<td>${userLink(r.reviewer)}</td>` : ""}
        <td>${esc(r.submitter)}</td>
        <td class="num wait">${w}d</td><td>${since}</td><td>${badges(r.build)}</td>
        <td class="stage">${esc(r.stage || "")}${r.stage_since ? ` <span class="muted">${days(r.stage_since)}d</span>` : ""}</td>
        <td><div class="snip">${esc(r.last_comment)}</div></td></tr>`;
    }).join("")}</tbody></table></div>`;
}

function overview() {
  const by = {};
  for (const r of D.queue) (by[r.reviewer] ??= []).push(r);
  const load = Object.entries(by).map(([u, rs]) => {
    const mine = rs.filter((r) => r.reviewer_turn).map((r) => days(r.waiting_since));
    return { u, open: rs.length, mine: mine.length, oldest: mine.length ? Math.max(...mine) : null,
             med: median(mine) };
  }).sort((a, b) => (b.oldest ?? -1) - (a.oldest ?? -1));
  const turn = D.queue.filter((r) => r.reviewer_turn);
  return `
    <h2>Reviewer load</h2>
    <div class="scroll"><table><thead><tr><th>Reviewer</th><th class="num">Open</th><th class="num">Their move</th>
      <th class="num">Oldest wait</th><th class="num">Median wait</th></tr></thead><tbody>
      ${load.map((l) => `<tr><td>${userLink(l.u)}</td><td class="num">${l.open}</td>
        <td class="num">${l.mine}</td><td class="num">${l.oldest ?? "—"}${l.oldest != null ? "d" : ""}</td>
        <td class="num">${l.med ?? "—"}${l.med != null ? "d" : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <h2>Unassigned (${D.unassigned.length})</h2>
    ${D.unassigned.length ? `<div class="scroll"><table><thead><tr><th>#</th><th>Package</th>
      <th>Submitter</th><th class="num">Open</th><th>Labels</th></tr></thead><tbody>
      ${D.unassigned.map((r) => `<tr><td>${issueLink(r.issue_number)}</td><td>${esc(r.title)}</td>
        <td>${esc(r.submitter)}</td><td class="num">${days(r.created_at)}d</td>
        <td>${(r.labels || []).map((l) => `<span class="b sub">${esc(l)}</span>`).join("")}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">None.</p>`}
    <h2>Waiting on a reviewer (${turn.length})</h2>
    ${queueTable(turn, true)}`;
}

function reviewer(u) {
  const rs = D.queue.filter((r) => r.reviewer === u);
  const mine = rs.filter((r) => r.reviewer_turn), theirs = rs.filter((r) => !r.reviewer_turn);
  return `<h2>${esc(u)} — your move (${mine.length})</h2>${queueTable(mine, false)}
          <h2>Waiting on submitter (${theirs.length})</h2>${queueTable(theirs, false)}`;
}

// Comment bodies are submitter-controlled markdown: render, then sanitize.
const md = (t) => DOMPurify.sanitize(marked.parse(t || "", { gfm: true, breaks: true }));
const EV = { labeled: "added", unlabeled: "removed", assigned: "assigned", unassigned: "unassigned",
             closed: "closed", reopened: "reopened" };

function thread(n, head, reviewers) {
  fetch(`i/${n}.json`, { cache: "no-store" }).then((r) => r.json()).then((items) => {
    const role = (it) => it.is_bot ? "bot" : it.who === head.submitter ? "submitter"
      : reviewers.includes(it.who) ? "reviewer" : "other";
    $("#thread").innerHTML = items.map((it) => {
      const anchor = it.kind === "comment" ? `issuecomment-${it.id}` : `event-${it.id}`;
      const when = it.id
        ? `<a href="${gh(n)}#${anchor}" target="_blank" rel="noopener">${new Date(it.created_at).toLocaleString()} ↗</a>`
        : new Date(it.created_at).toLocaleString();
      if (it.kind !== "comment")
        return `<li class="ev">${esc(it.who)} ${EV[it.kind]} <strong>${esc(it.body ?? "")}</strong> · ${when}</li>`;
      const r = role(it), meta = `<strong>${esc(it.who)}</strong> <span class="muted">${r} · ${when}</span>`;
      return r === "bot"
        ? `<li class="bot"><details><summary>${meta} — ${esc((it.body || "").split("\n")[0].slice(0, 120))}</summary>
             <div class="md">${md(it.body)}</div></details></li>`
        : `<li class="${r}">${meta}<div class="md">${md(it.body)}</div></li>`;
    }).join("");
  }).catch(() => { $("#thread").innerHTML = `<li>Couldn't load the thread.</li>`; });
}

function issue(n) {
  const rs = D.queue.filter((r) => r.issue_number === n);
  const un = D.unassigned.find((r) => r.issue_number === n);
  const head = rs[0] || un;
  if (!head) return `<p>#${n} isn't an open submission. <a href="${gh(n)}">Open on GitHub</a></p>`;
  setTimeout(() => thread(n, head, rs.map((r) => r.reviewer)));
  return `<h2>#${n} ${esc(head.title)} <span class="muted">by ${esc(head.submitter)}</span>
      · <a href="${gh(n)}" target="_blank" rel="noopener">GitHub ↗</a></h2>
    ${rs.length ? queueTable(rs, true) : `<p class="muted">Unassigned.</p>`}
    <h2>Conversation</h2>
    <ol class="tl" id="thread"><li class="ev">loading…</li></ol>`;
}

function route() {
  const [, kind, arg] = (location.hash.replace(/^#/, "") || "/").split("/");
  const v = kind === "r" ? reviewer(decodeURIComponent(arg))
          : kind === "i" ? issue(Number(arg)) : overview();
  $("#view").innerHTML = v;
  window.scrollTo(0, 0);
}

fetch("data.json", { cache: "no-store" }).then((r) => r.json()).then((d) => {
  D = d;
  $("#meta").textContent = `${D.repo} · ${D.queue.length} assignments · updated ${new Date(D.generated_at).toLocaleString()}`;
  addEventListener("hashchange", route);
  route();
}).catch((e) => { $("#meta").textContent = `failed to load data.json: ${e}`; });
</script>
</body>
</html>
