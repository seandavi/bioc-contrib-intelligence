<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5260"/></marker></defs><rect width="900" height="410" fill="#FFFFFF"/><rect x="20" y="20" width="250" height="96" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="32" y="42" font-size="14" font-weight="600" fill="#15181D">GitHub issue threads</text><text x="32" y="62" font-size="12" fill="#2B3038">Contributions (legacy, 2016–2025)</text><text x="32" y="79" font-size="12" fill="#2B3038">BiocContributions (2026–)</text><text x="32" y="96" font-size="12" fill="#2B3038">90,211 comments, 4,376 issues</text><rect x="20" y="150" width="250" height="96" rx="8" fill="#EEE8FA" stroke="#6B4FA8" stroke-width="1.5"/><text x="32" y="172" font-size="14" font-weight="600" fill="#15181D">Review corpus</text><text x="32" y="192" font-size="12" fill="#2B3038">assignee, not bot or submitter,</text><text x="32" y="209" font-size="12" fill="#2B3038">&gt; 1,500 characters</text><text x="32" y="226" font-size="12" fill="#2B3038">2,433 comments · 1,657 submissions</text><line x1="145" y1="116" x2="145" y2="150" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><text x="151.0" y="129.0" font-size="11" fill="#4B5260">select</text><rect x="330" y="20" width="260" height="70" rx="8" fill="#E6F4EA" stroke="#1E7A43" stroke-width="1.5"/><text x="342" y="42" font-size="14" font-weight="600" fill="#15181D">1. Extract</text><text x="342" y="62" font-size="12" fill="#2B3038">Haiku 5.5 · 2,433 calls</text><text x="342" y="79" font-size="12" fill="#2B3038">kind, findings, structure, tone</text><rect x="330" y="110" width="260" height="70" rx="8" fill="#E6F4EA" stroke="#1E7A43" stroke-width="1.5"/><text x="342" y="132" font-size="14" font-weight="600" fill="#15181D">2. Cluster</text><text x="342" y="152" font-size="12" fill="#2B3038">Sonnet 5.5 · 16 calls</text><text x="342" y="169" font-size="12" fill="#2B3038">26,669 findings → 336 items</text><rect x="330" y="200" width="260" height="70" rx="8" fill="#E6F4EA" stroke="#1E7A43" stroke-width="1.5"/><text x="342" y="222" font-size="14" font-weight="600" fill="#15181D">3. Assign</text><text x="342" y="242" font-size="12" fill="#2B3038">Haiku 5.5 · 326 batches</text><text x="342" y="259" font-size="12" fill="#2B3038">each finding → one item (95%)</text><rect x="330" y="290" width="260" height="70" rx="8" fill="#E6F4EA" stroke="#1E7A43" stroke-width="1.5"/><text x="342" y="312" font-size="14" font-weight="600" fill="#15181D">4. Report</text><text x="342" y="332" font-size="12" fill="#2B3038">Sonnet 5.5 + counting</text><text x="342" y="349" font-size="12" fill="#2B3038">tables, shares, quotes, examples</text><line x1="460" y1="90" x2="460" y2="110" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><line x1="460" y1="180" x2="460" y2="200" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><line x1="460" y1="270" x2="460" y2="290" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><line x1="270" y1="198" x2="330" y2="55" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="20" width="230" height="58" rx="8" fill="#EEE8FA" stroke="#6B4FA8" stroke-width="1.5"/><text x="662" y="42" font-size="14" font-weight="600" fill="#15181D">checklist.md</text><text x="662" y="62" font-size="12" fill="#2B3038">16 categories, ranked items</text><rect x="650" y="96" width="230" height="58" rx="8" fill="#EEE8FA" stroke="#6B4FA8" stroke-width="1.5"/><text x="662" y="118" font-size="14" font-weight="600" fill="#15181D">structure.md</text><text x="662" y="138" font-size="12" fill="#2B3038">how reviews are laid out</text><rect x="650" y="172" width="230" height="58" rx="8" fill="#EEE8FA" stroke="#6B4FA8" stroke-width="1.5"/><text x="662" y="194" font-size="14" font-weight="600" fill="#15181D">examples.md</text><text x="662" y="214" font-size="12" fill="#2B3038">3 anonymised reviews</text><line x1="590" y1="325" x2="650" y2="49" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="268" width="230" height="70" rx="8" fill="#EAF1FC" stroke="#1D5BB8" stroke-width="1.5"/><text x="662" y="290" font-size="14" font-weight="600" fill="#15181D">Co-review skills</text><text x="662" y="310" font-size="12" fill="#2B3038">First review, Follow-up</text><text x="662" y="327" font-size="12" fill="#2B3038">(app/skills/*.md)</text><line x1="765" y1="230" x2="765" y2="268" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><text x="771.0" y="245.0" font-size="11" fill="#4B5260">condensed</text><rect x="20" y="384" width="14" height="14" rx="3" fill="#FDF3E1" stroke="#B7791F"/><text x="40" y="395" font-size="12" fill="#2B3038">external source</text><rect x="155" y="384" width="14" height="14" rx="3" fill="#EEE8FA" stroke="#6B4FA8"/><text x="175" y="395" font-size="12" fill="#2B3038">data / outputs</text><rect x="283" y="384" width="14" height="14" rx="3" fill="#E6F4EA" stroke="#1E7A43"/><text x="303" y="395" font-size="12" fill="#2B3038">model step</text><rect x="383" y="384" width="14" height="14" rx="3" fill="#EAF1FC" stroke="#1D5BB8"/><text x="403" y="395" font-size="12" fill="#2B3038">used in the app</text></svg>
