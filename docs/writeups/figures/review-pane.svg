<svg xmlns="http://www.w3.org/2000/svg" width="910" height="472" viewBox="0 0 910 472" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5260"/></marker></defs><rect width="910" height="472" fill="#FFFFFF"/><rect x="20" y="20" width="400" height="300" rx="8" fill="#F1F2F4" stroke="#5F6673" stroke-width="1.5"/><text x="32" y="42" font-size="14" font-weight="600" fill="#15181D">Review detail (left)</text><text x="32" y="62" font-size="12" fill="#2B3038">package, submitter, reviewer, stage</text><text x="32" y="79" font-size="12" fill="#2B3038">whose move, days waiting</text><text x="32" y="96" font-size="12" fill="#2B3038">issue timeline</text><text x="32" y="113" font-size="12" fill="#2B3038">current checks (r-universe)</text><text x="32" y="130" font-size="12" fill="#2B3038">versions</text><rect x="450" y="20" width="270" height="150" rx="8" fill="#EAF1FC" stroke="#1D5BB8" stroke-width="1.5"/><text x="462" y="42" font-size="14" font-weight="600" fill="#15181D">Co-review chat (top right)</text><text x="462" y="62" font-size="12" fill="#2B3038">skill buttons: Follow-up,</text><text x="462" y="79" font-size="12" fill="#2B3038">Check triage, First review,</text><text x="462" y="96" font-size="12" fill="#2B3038">Fit &amp; overlap, Nudge</text><text x="462" y="113" font-size="12" fill="#2B3038">answers cite comments and</text><text x="462" y="130" font-size="12" fill="#2B3038">code lines; tool calls shown</text><rect x="450" y="190" width="270" height="130" rx="8" fill="#EAF1FC" stroke="#1D5BB8" stroke-width="1.5"/><text x="462" y="212" font-size="14" font-weight="600" fill="#15181D">Shared draft (bottom right)</text><text x="462" y="232" font-size="12" fill="#2B3038">agent edits it directly</text><text x="462" y="249" font-size="12" fill="#2B3038">diff + undo; Edit / Preview /</text><text x="462" y="266" font-size="12" fill="#2B3038">Split / pop-out preview</text><text x="462" y="283" font-size="12" fill="#2B3038">reviewer copies and posts it</text><rect x="750" y="20" width="140" height="86" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="762" y="42" font-size="14" font-weight="600" fill="#15181D">Agent reads</text><text x="762" y="62" font-size="12" fill="#2B3038">thread, checks,</text><text x="762" y="79" font-size="12" fill="#2B3038">logs, source at</text><text x="762" y="96" font-size="12" fill="#2B3038">built commit</text><rect x="750" y="126" width="140" height="70" rx="8" fill="#EEE8FA" stroke="#6B4FA8" stroke-width="1.5"/><text x="762" y="148" font-size="14" font-weight="600" fill="#15181D">Skill text</text><text x="762" y="168" font-size="12" fill="#2B3038">corpus checklist,</text><text x="762" y="185" font-size="12" fill="#2B3038">review structure</text><line x1="750" y1="63" x2="720" y2="63" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><line x1="750" y1="161" x2="720" y2="140" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="350" width="400" height="70" rx="8" fill="#F1F2F4" stroke="#5F6673" stroke-width="1.5"/><text x="32" y="372" font-size="14" font-weight="600" fill="#15181D">Reviewer</text><text x="32" y="392" font-size="12" fill="#2B3038">asks, edits, decides, posts</text><text x="32" y="409" font-size="12" fill="#2B3038">(the agent never posts)</text><line x1="420" y1="385" x2="450" y2="300" stroke="#4B5260" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="446" width="14" height="14" rx="3" fill="#F1F2F4" stroke="#5F6673"/><text x="40" y="457" font-size="12" fill="#2B3038">existing page / person</text><rect x="204" y="446" width="14" height="14" rx="3" fill="#EAF1FC" stroke="#1D5BB8"/><text x="224" y="457" font-size="12" fill="#2B3038">co-review pane</text><rect x="332" y="446" width="14" height="14" rx="3" fill="#FDF3E1" stroke="#B7791F"/><text x="352" y="457" font-size="12" fill="#2B3038">agent context</text><rect x="453" y="446" width="14" height="14" rx="3" fill="#EEE8FA" stroke="#6B4FA8"/><text x="473" y="457" font-size="12" fill="#2B3038">from the corpus</text></svg>
